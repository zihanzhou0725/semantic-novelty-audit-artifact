inherit: 
    - base.yaml
    
model:
    family: san
    n_dims: 28
    n_positions: 100

training:
    task: conjunction
    data: boolean
    batch_size: 8
    train_steps: 80001
    learning_rate: 0.000075
    curriculum:
        dims:
            start: 28
            end: 28
            inc: 1
            interval: 2000
        points:
            start: 70
            end: 70
            inc: 5
            interval: 2000

out_dir: ../models/conjunction

wandb:
    name: "conj_attmlpfreeze_ln"


misc:
    gpu: 0
    wandb: True