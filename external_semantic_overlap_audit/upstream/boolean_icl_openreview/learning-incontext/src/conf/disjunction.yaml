inherit: 
    - base.yaml

model:
    n_dims: 25
    n_positions: 100

training:
    task: disjunction
    data: boolean
    batch_size: 2
    train_steps: 200001
    learning_rate: 0.00001
    curriculum:
        dims:
            start: 25
            end: 25
            inc: 1
            interval: 2000
        points:
            start: 50
            end: 50
            inc: 5
            interval: 2000

out_dir: ../models/disjunction

wandb:
    name: "disjunction_all_freeze_mlp"


misc:
    gpu: 3
    wandb: True