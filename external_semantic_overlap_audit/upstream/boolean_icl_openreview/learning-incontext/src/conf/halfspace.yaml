inherit: 
    - base.yaml

model:
    family: san
    n_dims: 20
    n_positions: 100

training:
    task: halfspace
    data: boolean
    batch_size: 8
    train_steps: 70001
    learning_rate: 0.0001
    curriculum:
        dims:
            start: 20
            end: 20
            inc: 1
            interval: 2000
        points:
            start: 70
            end: 70
            inc: 5
            interval: 5000

out_dir: ../models/halfspace

wandb:
    name: "halfspace_attmlpfreeze_ln"


misc:
    gpu: 0
    wandb: True
