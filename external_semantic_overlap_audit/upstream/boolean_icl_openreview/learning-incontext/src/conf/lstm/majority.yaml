inherit: 
    - ../lstm_base.yaml

model:
    family: lstm
    n_dims: 24
    n_positions: 100

training:
    task: majority
    data: boolean
    batch_size: 32
    train_steps: 50001
    learning_rate: 0.000025
    curriculum:
        dims:
            start: 24
            end: 24
            inc: 1
            interval: 2000
        points:
            start: 70
            end: 70
            inc: 5
            interval: 5000

out_dir: ../models/majority

wandb:
    name: "maj"


misc:
    gpu: 5
    wandb: True
