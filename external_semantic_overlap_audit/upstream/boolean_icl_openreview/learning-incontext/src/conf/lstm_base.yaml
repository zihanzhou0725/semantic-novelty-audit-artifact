inherit: 
    - models/lstm.yaml
    - wandb.yaml

model:
    n_dims: 20

training:
    data: boolean
    task_kwargs: {}
    batch_size: 64
    learning_rate: 0.0001
    save_every_steps: 1000
    keep_every_steps: 100000
    train_steps: 500001
    curriculum:
        dims:
            start: 5
            end: 20
            inc: 1
            interval: 2000

misc:
    gpu: 1
    wandb: True
