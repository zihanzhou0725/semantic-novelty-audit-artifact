inherit: 
    - base.yaml

model:
    n_dims: 10
    n_positions: 300

training:
    task: sparse_parity
    data: boolean
    batch_size: 32
    learning_rate: 0.0001
    train_steps: 2000001
    curriculum:
        dims:
            start: 10
            end: 10
            inc: 1
            interval: 2000
        points:
            start: 150
            end: 150
            inc: 5
            interval: 2000

out_dir: ../models/sparse_parity

wandb:
    name: "sparse_parity_k1_"


misc:
    gpu: 1
    wandb: True